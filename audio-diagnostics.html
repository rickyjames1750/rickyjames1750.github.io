<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bayward audio mix check</title>
<style>body{max-width:850px;margin:50px auto;padding:24px;background:#10212d;color:#e3f2e7;font:16px system-ui}button{padding:14px 22px;cursor:pointer}article{padding:18px 0;border-bottom:1px solid #416055}audio{display:block;width:100%;margin:10px 0}pre{white-space:pre-wrap;font:13px monospace}h1{font-size:28px}</style>
<h1>Bayward: deterministic audio stems</h1><p>Eight seconds per stem, rendered offline with the production graph at the default 70% volume. Nothing plays automatically.</p><button id="render">Render audio checks</button><p id="status" role="status">Ready.</p><section id="results"></section><pre id="metrics"></pre>
<script type="module">
import {renderAudioDiagnostics,audioBufferWav} from './src/audio-diagnostics.js';
const summaries=[];document.querySelector('#render').onclick=async()=>{const button=document.querySelector('#render');button.disabled=true;document.querySelector('#status').textContent='Rendering…';
try{await renderAudioDiagnostics({onStem({stem,buffer,metrics}){summaries.push({stem,...metrics});const article=document.createElement('article'),heading=document.createElement('strong'),audio=document.createElement('audio');heading.textContent=stem;audio.controls=true;audio.src=URL.createObjectURL(audioBufferWav(buffer));article.append(heading,audio);document.querySelector('#results').append(article);document.querySelector('#metrics').textContent=JSON.stringify(summaries,null,2);}});document.querySelector('#status').textContent='Complete. Every stem uses the same fixed telemetry trace.';document.body.dataset.complete='true';}catch(error){document.querySelector('#status').textContent=error.message;}finally{button.disabled=false;}};
</script></html>
